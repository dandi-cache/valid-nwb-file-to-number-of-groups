name: Benchmark group walk (temporary)

# Temporary, dispatch-only: time the old `visititems` walk against the hard-link walk on the
# two largest assets of the batch that run #393 was processing, on a hosted runner, and print
# each byte-range request so the access pattern is visible in the job log. Touches no dataset
# branch. To be removed once the numbers are recorded on PR #4.

permissions: {}

on:
  workflow_dispatch:
    inputs:
      old_walk_cap_minutes:
        description: "Cap on each old-walk run, in minutes."
        required: false
        type: number
        default: 25

jobs:
  Benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Runner resources
        run: |
          nproc; free -h; df -h /
      - name: Compare walks
        env:
          OLD_WALK_CAP_MINUTES: ${{ inputs.old_walk_cap_minutes }}
        run: |
          cat > /tmp/bench.py <<'EOF'
          import resource
          import sys
          import time

          import h5py
          import remfile
          import remfile.RemFile as rf

          sys.path.insert(0, "code")
          import update  # noqa: E402

          content_id, which = sys.argv[1], sys.argv[2]
          t0 = time.time()
          n = 0
          total = 0
          _orig = rf._get_bytes


          def _tracing(session, url, start, end, **kw):
              global n, total
              n += 1
              total += end - start + 1
              t = time.time()
              out = _orig(session, url, start, end, **kw)
              if n <= 50 or n % 100 == 0:
                  print(
                      f"  req#{n} t={t - t0:7.1f}s offset={start / 1e9:9.4f}GB len={(end - start + 1) / 1e6:6.2f}MB "
                      f"took={time.time() - t:.2f}s total={total / 1e6:.1f}MB",
                      flush=True,
                  )
              return out


          rf._get_bytes = _tracing
          url = update._BLOB_URL_TEMPLATE.format(prefix=content_id[:3], infix=content_id[3:6], content_id=content_id)
          rem_file = remfile.File(url=url)
          print(f"{which} walk of {content_id} ({rem_file.length / 1e9:.1f} GB)", flush=True)
          with h5py.File(rem_file, "r") as f:
              if which == "old":
                  count = 1

                  def visit(_name, obj):
                      global count
                      if isinstance(obj, h5py.Group):
                          count += 1

                  f.visititems(visit)
              else:
                  count = 1 + update._count_hdf5_subgroups(group=f, visited_addresses={h5py.h5o.get_info(f.id).addr})
          rss = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024
          print(
              f"RESULT {which} {content_id}: groups={count} elapsed={time.time() - t0:.1f}s "
              f"requests={n} fetched={total / 1e6:.1f}MB peak_rss={rss:.0f}MiB",
              flush=True,
          )
          EOF
          uv sync --project envs
          for cid in 119f7145-5048-4b14-9f00-bc4970972297 62091003-d8d1-4128-a2cb-d8da4ac8dc2d; do
            echo "::group::new walk ${cid}"
            uv run --project envs python -u /tmp/bench.py "${cid}" new
            echo "::endgroup::"
            echo "::group::old walk ${cid} (capped at ${OLD_WALK_CAP_MINUTES} min)"
            timeout "$((OLD_WALK_CAP_MINUTES * 60))" uv run --project envs python -u /tmp/bench.py "${cid}" old \
              || echo "RESULT old ${cid}: did not finish within ${OLD_WALK_CAP_MINUTES} min (exit $?)"
            echo "::endgroup::"
          done
